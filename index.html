<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Source Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🔍 Web Source Code Viewer</h2>
        <p>Masukkan URL website yang ingin kamu lihat kodenya:</p>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://contoh.com" required>
            <button onclick="fetchSource()">Ambil Kode</button>
        </div>

        <div id="loading" class="hidden">Sedang mengambil data...</div>

        <div class="result-section">
            <h3>Hasil Source Code:</h3>
            <textarea id="resultOutput" readonly placeholder="Kode HTML/CSS/JS akan muncul di sini..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
