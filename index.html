<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQC Generator || Gihh Hosting</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet5" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Efek Background Glow -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <header>
    <h1><i class="fa-solid fa-wand-magic-sparkles"></i> IQC GENERATOR</h1>
    <p class="subtitle">Buat kutipan iPhone custom jadi lebih keren & cepat!</p>
  </header>

  <main class="container">
    <div class="input-group">
      <label for="message"><i class="fa-regular fa-comment-dots"></i> Masukkan Teks:</label>
      <input type="text" id="message" placeholder="Tuliskan Kata-Kata Kelen Bray... ✨" autocomplete="off">
    </div>
    
    <button onclick="generateImage()">
      <span>Langsung Kirim Aja</span> <i class="fa-solid fa-paper-plane"></i>
    </button>

    <div class="result" id="result"></div>
  </main>

  <footer>
    <p>© 2026 <span>Gihh Hosting</span>. All Rights Reserved.</p>
  </footer>

  <script>
    function generateImage() {
      const message = document.getElementById("message").value.trim();
      const resultDiv = document.getElementById("result");

      if (!message) {
        alert("Masukan Lah Dulu Text Nya Anjg!!");
        return;
      }

      resultDiv.innerHTML = `
        <div class="loader-container">
          <div class="loader"></div>
          <p>Abang Proses Dulu Ya...</p>
        </div>
      `;

      const apiUrl = `https://brat.siputzx.my.id/iphone-quoted?time=11%3A26&messageText=${encodeURIComponent(message)}&carrierName=INDOSAT%20OOREDOO&batteryPercentage=88&signalStrength=4&emojiStyle=apple`;

      setTimeout(() => {
        resultDiv.innerHTML = `
          <p class="success-text"><i class="fa-solid fa-circle-check"></i> Kiw Kiw Ini Hasil Nya:</p>
          <div class="image-wrapper">
            <img src="${apiUrl}" alt="Generated Image">
          </div>
          <a class="download-btn" href="${apiUrl}" target="_blank" download="iqc-image.png">
            <i class="fa-solid fa-download"></i> Download Gambar
          </a>
        `;
      }, 800);
    }
  </script>
</body>
</html>
