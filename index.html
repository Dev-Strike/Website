<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Source Viewer Custom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🔍 View Page Source Online</h2>
        <p>Masukkan URL website untuk melihat source code-nya:</p>
        
        <div class="url-input-container">
            <input type="text" id="uri" placeholder="contoh.com atau https://contoh.com" required>
            <button id="submit-btn" onclick="fetchSource()">View Source</button>
        </div>

        <div id="loading" class="hidden" style="margin: 15px 0; color: #06b6d4;">Sedang mengambil data website...</div>

        <div class="code-section" style="margin-top: 20px;">
            <textarea id="code-block" readonly placeholder="Source code HTML akan muncul di sini..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
