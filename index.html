<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike AI - Asisten Pintar Anda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0505;
            --bg-sidebar: #120808;
            --bg-panel: #1a0c0c;
            --accent-red: #8b0000;
            --accent-glow: #ff1a1a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #381313;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 220px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 18px; }
        .sidebar-top { display: flex; flex-direction: column; gap: 18px; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; color: #fff; }
        .logo-area i { color: var(--accent-glow); font-size: 1.4rem; filter: drop-shadow(0 0 8px rgba(255, 26, 26, 0.6)); }
        
        .new-chat-btn { background: linear-gradient(135deg, #5c0000, var(--accent-red)); color: white; border: 1px solid #ff4d4d; padding: 11px; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .new-chat-btn:hover { background: linear-gradient(135deg, var(--accent-red), #b30000); box-shadow: 0 4px 20px rgba(255, 26, 26, 0.6); }

        .main-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at top right, #1f0808 0%, var(--bg-main) 60%); position: relative; min-width: 0; }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); background: rgba(18, 8, 8, 0.7); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .chat-header h1 { font-size: 1.05rem; font-weight: 600; }
        .model-badge { background-color: rgba(139, 0, 0, 0.3); border: 1px solid var(--accent-red); color: #ff8080; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; white-space: nowrap; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; max-width: 900px; width: 100%; margin: 0 auto; }
        .message { display: flex; gap: 12px; max-width: 85%; line-height: 1.6; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .message.ai .message-avatar { background: linear-gradient(135deg, var(--accent-red), #400); color: #fff; box-shadow: 0 0 10px rgba(255, 26, 26, 0.4); }
        .message.user .message-avatar { background-color: #2b2b2b; color: #fff; }
        .message.ai .message-content { background-color: #150909; border: 1px solid #3b1010; padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; word-break: break-word; }
        .message.user .message-content { background-color: #2a0f0f; border: 1px solid #521818; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; word-break: break-word; }

        .chat-input-area { padding: 14px 20px; background: linear-gradient(to top, var(--bg-main) 80%, transparent); display: flex; justify-content: center; }
        .input-wrapper { max-width: 800px; width: 100%; background-color: var(--bg-panel); border: 1px solid #4a1515; border-radius: 14px; display: flex; align-items: center; padding: 6px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
        .input-wrapper:focus-within { border-color: var(--accent-glow); box-shadow: 0 0 20px rgba(255, 26, 26, 0.3); }
        .input-wrapper textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 0.92rem; resize: none; padding: 8px; max-height: 120px; outline: none; }
        .send-btn { background-color: var(--accent-red); color: white; border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .send-btn:hover { background-color: var(--accent-glow); transform: scale(1.05); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3b1515; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo-area">
                <i class="fa-solid fa-bolt-lightning"></i>
                <span>Strike AI</span>
            </div>
            <button class="new-chat-btn" onclick="location.reload();">
                <i class="fa-solid fa-plus"></i> Obrolan Baru
            </button>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-header">
            <h1>Sesi Obrolan Aktif</h1>
            <div class="model-badge"><i class="fa-solid fa-shield-halved"></i> Strike AI v1.0</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-avatar"><i class="fa-solid fa-bolt-lightning"></i></div>
                <div class="message-content">Halo! Saya <strong>Strike AI</strong>. Tanyakan apa saja kepada saya, saya siap membantu!</div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Ketik pesan untuk Strike AI..."></textarea>
                <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        const API_KEY = "AQ.Ab8RN6LiI0Vim3wj3cRm_9bmGLoc3n0e983ISAOZcAk5T4msGw";
        const MODEL = "gemini-2.5-flash";

        async function callGemini(text) {
            const payload = JSON.stringify({
                contents: [{ parts: [{ text }] }]
            });

            // Percobaan 1: header x-goog-api-key
            let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': API_KEY
                },
                body: payload
            });

            let data = await res.json();
            if (res.ok && data.candidates && data.candidates[0]) {
                return data.candidates[0].content.parts[0].text;
            }

            // Percobaan 2: query key
            res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: payload
            });

            data = await res.json();
            if (res.ok && data.candidates && data.candidates[0]) {
                return data.candidates[0].content.parts[0].text;
            }

            const msg = data?.error?.message || `HTTP ${res.status}`;
            throw new Error(msg);
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            chatMessages.insertAdjacentHTML('beforeend', `
                <div class="message user">
                    <div class="message-avatar">U</div>
                    <div class="message-content">${escapeHtml(text)}</div>
                </div>`);
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatMessages.insertAdjacentHTML('beforeend', `
                <div class="message ai" id="${loadingId}">
                    <div class="message-avatar"><i class="fa-solid fa-bolt-lightning"></i></div>
                    <div class="message-content"><em>Strike AI sedang berpikir...</em></div>
                </div>`);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const aiReply = await callGemini(text);
                document.getElementById(loadingId)?.remove();
                chatMessages.insertAdjacentHTML('beforeend', `
                    <div class="message ai">
                        <div class="message-avatar"><i class="fa-solid fa-bolt-lightning"></i></div>
                        <div class="message-content">${formatText(aiReply)}</div>
                    </div>`);
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                chatMessages.insertAdjacentHTML('beforeend', `
                    <div class="message ai">
                        <div class="message-avatar"><i class="fa-solid fa-bolt-lightning"></i></div>
                        <div class="message-content" style="color: #ff6b6b;">
                            <strong>Gagal merespons:</strong><br>${escapeHtml(error.message || 'Cek koneksi internet atau jenis API key.')}
                        </div>
                    </div>`);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function formatText(str) {
            return escapeHtml(str).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
