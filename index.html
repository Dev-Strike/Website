<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Quote Generator</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk fitur download gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-2xl font-bold mb-6 text-center">iPhone Quote Generator</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl items-start">
        
        <!-- Bagian Preview (Tampilan ala iPhone Lock Screen) -->
        <div class="flex justify-center">
            <div id="capture" class="relative w-[300px] h-[600px] bg-black rounded-[40px] border-[8px] border-slate-700 shadow-2xl overflow-hidden flex flex-col items-center justify-center p-6 text-center">
                
                <!-- Wallpaper / Foto Opsional -->
                <div id="image-container" class="mb-4 hidden w-32 h-32 rounded-2xl overflow-hidden border-2 border-white/20 shadow-lg">
                    <img id="preview-img" src="" alt="Uploaded" class="w-full h-full object-cover">
                </div>

                <!-- Jam Ala Lock Screen iPhone -->
                <div class="mb-6">
                    <div id="lock-time" class="text-5xl font-semibold tracking-tight text-white drop-shadow-md">09:41</div>
                    <div id="lock-date" class="text-xs text-white/70 mt-1 font-medium drop-shadow-sm">Kamis, 19 November</div>
                </div>

                <!-- Teks Quote / Kata-kata -->
                <div class="w-full px-2">
                    <p id="quote-output" class="text-white text-sm font-normal leading-relaxed drop-shadow-md break-words">
                        "Hidup bukan tentang menemukan diri sendiri, tapi tentang menciptakan diri sendiri."
                    </p>
                </div>
            </div>
        </div>

        <!-- Bagian Kontrol / Form Input -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-lg flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Tulis Quote / Kata-kata:</label>
                <textarea id="quote-input" rows="4" class="w-full bg-slate-700 rounded-lg p-3 text-sm border border-slate-600 focus:outline-none focus:border-indigo-500" placeholder="Ketik kata-kata mutiara di sini...">"Hidup bukan tentang menemukan diri sendiri, tapi tentang menciptakan diri sendiri."</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Upload Foto (Opsional):</label>
                <input type="file" id="image-input" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                <button id="remove-img" class="mt-2 text-xs text-red-400 hover:underline hidden">Hapus Foto</button>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Jam Lock Screen:</label>
                <input type="text" id="time-input" value="09:41" class="w-full bg-slate-700 rounded-lg p-2 text-sm border border-slate-600 focus:outline-none focus:border-indigo-500">
            </div>

            <button id="download-btn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Download Gambar
            </button>
        </div>

    </div>

    <!-- Script JavaScript untuk Interaksi -->
    <script>
        const quoteInput = document.getElementById('quote-input');
        const quoteOutput = document.getElementById('quote-output');
        const imageInput = document.getElementById('image-input');
        const previewImg = document.getElementById('preview-img');
        const imageContainer = document.getElementById('image-container');
        const removeImgBtn = document.getElementById('remove-img');
        const timeInput = document.getElementById('time-input');
        const lockTime = document.getElementById('lock-time');
        const downloadBtn = document.getElementById('download-btn');
        const captureArea = document.getElementById('capture');

        // Update teks quote secara real-time
        quoteInput.addEventListener('input', () => {
            quoteOutput.textContent = quoteInput.value || '...';
        });

        // Update jam secara real-time
        timeInput.addEventListener('input', () => {
            lockTime.textContent = timeInput.value || '09:41';
        });

        // Handle upload foto opsional
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    imageContainer.classList.remove('hidden');
                    removeImgBtn.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Hapus foto jika tidak jadi dipakai
        removeImgBtn.addEventListener('click', () => {
            imageInput.value = '';
            previewImg.src = '';
            imageContainer.classList.add('hidden');
            removeImgBtn.classList.add('hidden');
        });

        // Fitur Download Gambar
        downloadBtn.addEventListener('click', () => {
            downloadBtn.textContent = "Memproses...";
            downloadBtn.disabled = true;

            html2canvas(captureArea, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'iphone-quote.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                downloadBtn.textContent = "Download Gambar";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("Gagal mendownload:", err);
                downloadBtn.textContent = "Download Gambar";
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
